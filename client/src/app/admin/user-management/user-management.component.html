<div class="row">
    <table class="table">
        <thead>
            <tr>
                <th style="width: 30%;">Username</th>
                <th style="width: 40%;">Active Roles</th>
                <th style="width: 30%;"></th>
            </tr>
        </thead>
        <tbody>
            @for(user of users; track user.userName)
           {
                <tr>
                <td>{{ user.userName }}</td>
                <td>
                    {{ user.roles }}
                </td>
                <td>
                    <button (click)="openRolesModal(user)" class="btn btn-info" >Edit Roles</button>
                    <!-- <button class="btn btn-danger" (click)="deleteUser(user)">Delete</button> -->
                </td>
            </tr>
           }
            
    </table>
</div>
